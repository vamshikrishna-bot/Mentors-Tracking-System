function tkAdd(){const F=F_(),ty=F.ty||'mixed';if(!(F.t||'').trim())return toast('Enter a title');const qs=bq(ty);if(!qs)return;const g=qs.filter(q=>q.t!=='text').length,a={id:'k'+Date.now(),sr:SMAP[sn()],title:F.t.trim(),desc:(F.d||'').trim(),due:F.due||dd(),max:+F.max||(g||qs.length),mins:+F.mins||30,link:'',qs};A.push(a);D.mk.t.push(a);S.F={};save();toast('✓ Task published to your juniors');render()}
function tkMarks(id){const F=F_();myJ().forEach(j=>{const v=F['m_'+j.roll];if(v===undefined)return;if(v==='')delete D.tm[id+'|'+j.roll];else D.tm[id+'|'+j.roll]=+v});S.F={};save();toast('✓ Marks saved');render()}
function sTask(){const me=SMAP[sn()],L=A.filter(a=>a.sr===me),J=myJ();return `<h1>Tasks</h1><div class="card"><h2>Publish a proctored task</h2>${fi('t','Title','e.g. Week 2 Arrays Test')}${ta('d','Instructions','',2)}<div class="row"><div class="g">${fi('due','Due date','','date')}</div><div class="g">${fi('mins','Duration (min)','30','number')}</div><div class="g">${fi('max','Max marks','','number')}</div></div><label>Question type</label><select onchange="(S.F=S.F||{}).ty=this.value;S.F.qs=null;render()">${[['mixed','🧩 Mixed (MCQ + blanks + written)'],['mcq','☑ MCQ'],['blank','▭ Fill in the blanks'],['text','✍ Written answers']].map(x=>`<option value="${x[0]}" ${(F_().ty||'mixed')===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select><h2 style="margin-top:12px">Questions</h2>${qb(F_().ty||'mixed')}<button class="btn w" onclick="tkAdd()">Publish Task</button><p class="m">Juniors take it on this site only, camera + mic proctored. MCQ and blanks are auto-graded.</p></div><h2>Your tasks (${L.length})</h2>${L.map(a=>{const op=S.open===a.id;return `<div class="card"><div class="row"><b class="g">${esc(a.title)}</b>${pill(J.filter(j=>D.att[a.id+'|'+j.roll]).length+'/'+J.length+' attempted','tl')}</div><div class="m">${a.qs.length} questions · ${a.mins} min · Due ${fd(a.due)} · Max ${a.max}</div><div class="row" style="margin-top:8px"><button class="btn o" onclick="S.open=${op?'null':"'"+a.id+"'"};S.F={};render()">${op?'Hide':'Review attempts'}</button>${D.mk.t.some(x=>x.id===a.id)?`<button class="btn o" onclick="mkDel('t','${a.id}')">Delete</button>`:''}</div>${op?J.map(j=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${esc(j.name)}</b> <span class="m">${j.roll}</span><br>${attR(a,j)}<br><input type="number" style="width:130px" placeholder="Marks /${a.max}" value="${D.tm[a.id+'|'+j.roll]??''}" oninput="(S.F=S.F||{})['m_${j.roll}']=this.value"></div>`).join('')+`<button class="btn w" onclick="tkMarks('${a.id}')">Save Marks</button>`:''}</div>`}).join('')}`}
function ivAdd(){const F=F_(),zl=(F.zl||'').trim();if(!(F.t||'').trim()||!F.at)return toast('Enter a title and date/time');if(zl&&!/^https?:\/\//.test(zl))return toast('Zoom link must start with https://');S.F={};const a={id:'k'+Date.now(),iv:1,qs:[],sr:SMAP[sn()],title:F.t.trim(),start:new Date(F.at).getTime(),mins:+F.mins||20,topics:(F.tp||'General').trim(),link:zl};INT.push(a);D.mk.i.push(a);save();toast('✓ Interview scheduled');render()}
function ivEval(id,r){const F=F_(),k=id+'|'+r,o=D.iv[k]||{},g=x=>F['e_'+r+'_'+x];const sc=g('sc')!==undefined?g('sc'):o.sc;if(sc===undefined||sc==='')return toast('Enter a score out of 10');D.iv[k]={sc:Math.min(10,Math.max(0,+sc)),rec:g('rec')||o.rec||'Needs practice',n:g('n')!==undefined?g('n'):(o.n||''),by:sn()};save();toast('✓ Evaluation saved');render()}
const ivSt=(a,j)=>{const k=a.id+'|'+j.roll,jn=D.jn[k],e=D.iv[k];return (jn?pill('✓ Joined Zoom '+jn,'ok'):D.att[k]?attR(a,j):pill('Not joined','gr'))+(e?pill('Score '+e.sc+'/10','ok')+pill(esc(e.rec),'tl')+(e.n?' <i>'+esc(e.n)+'</i>':''):'')};
function sInt(){const me=SMAP[sn()],L=INT.filter(a=>a.sr===me),J=myJ();return `<h1>Live Interviews</h1><div class="card"><h2>Schedule an interview</h2>${fi('t','Title','e.g. Mock Interview Round 1')}<div class="row"><div class="g">${fi('at','Date &amp; time','','datetime-local')}</div><div class="g">${fi('mins','Duration (min)','20','number')}</div></div>${fi('zl','Zoom / Meet link (you host it)','https://zoom.us/j/...')}${fi('tp','Topics','DSA, projects')}<button class="btn w" onclick="ivAdd()">Schedule Interview</button><p class="m">With a link: juniors join your Zoom from 5 min before the start (join time is recorded). Without a link: they join the proctored room on this site.</p></div><h2>Scheduled (${L.length})</h2>${L.map(a=>{const op=S.open===a.id;return `<div class="card"><b>${esc(a.title)}</b><div class="m">${fdt(a.start)} · ${a.mins} min · ${esc(a.topics)}</div>${a.link?`<a class="btn" href="${esc(a.link)}" target="_blank" rel="noopener">▶ Start meeting (host)</a>`:'<div class="m">In-site proctored room (no Zoom link)</div>'}<div class="row" style="margin-top:8px"><button class="btn o" onclick="S.open=${op?'null':"'"+a.id+"'"};S.F={};render()">${op?'Hide':'Attendance, evaluation &amp; logs'}</button>${D.mk.i.some(x=>x.id===a.id)?`<button class="btn o" onclick="mkDel('i','${a.id}')">Delete</button>`:''}</div>${op?J.map(j=>{const e=D.iv[a.id+'|'+j.roll]||{},r=j.roll;return `<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${esc(j.name)}</b> <span class="m">${r}</span><br>${ivSt(a,j)}<div class="row" style="margin-top:6px"><input type="number" min="0" max="10" style="width:90px" placeholder="Score/10" value="${e.sc??''}" oninput="(S.F=S.F||{}).e_${r}_sc=this.value"><select onchange="(S.F=S.F||{}).e_${r}_rec=this.value">${['Needs practice','On track','Strong'].map(x=>`<option ${(e.rec||'Needs practice')===x?'selected':''}>${x}</option>`).join('')}</select></div><input placeholder="Interview notes" value="${esc(e.n||'')}" oninput="(S.F=S.F||{}).e_${r}_n=this.value"><button class="btn o" onclick="ivEval('${a.id}','${r}')">Save evaluation</button></div>`}).join(''):''}</div>`}).join('')}`}
/* --- Super Admin --- */
function adminV(){const t=S.tab||'aov',c=({aov:aOv,aj:aJun,aa:aAsm,as:aSen})[t]();return shell(c,[['aov','📊','Overview',0],['aj','👥','All Juniors',0],['aa','📝','Assessments',0],['as','🧑‍🏫','Seniors',0]],t,S.o.n,'Super Admin','S.o=null;render()',k=>`S.tab='${k}';S.F={};S.open=null;S.fp=null;render()`)}
function aJun(){const q=(S.q||'').toLowerCase(),L=JUN.filter(j=>(j.name+j.roll+j.sr).toLowerCase().includes(q));return `<h1>All Juniors</h1><div class="card"><label>Search by name, roll number or senior (press Enter)</label><input value="${esc(S.q||'')}" onchange="S.q=this.value;S.fp=null;render()"><div class="m">${L.length} of ${JUN.length} students${L.length>25?' · showing first 25':''}</div></div>${L.slice(0,25).map(j=>`<div class="card"><div class="row"><b class="g">${esc(j.name)} <span class="m">${j.roll} · ${j.batch}</span></b>${pill('Latest '+lastN(j.roll),'tl')}${sub(j.roll,cw())?vpill(j.roll,cw()):pill('Not submitted','er')}</div><div class="m">Senior: ${esc(j.sr)}</div><button class="btn o" style="margin-top:6px" onclick="S.fp=${S.fp===j.roll?'null':"'"+j.roll+"'"};render()">${S.fp===j.roll?'Hide data':'All data &amp; submissions'}</button>${S.fp===j.roll?jFull(j):''}</div>`).join('')}`}
function aOv(){const w=cw(),tg=T[w];return `<h1>Overview</h1><p class="m">Week ${w+1} · plan target ${tg}</p>`+tiles([['Seniors',SENIORS.length,'tl'],['Juniors',JUN.length,'tl'],['Submitted',JUN.filter(j=>sub(j.roll,w)).length+'/'+JUN.length,'tl'],['Verified',JUN.filter(j=>vs(j,w)==='verified').length,'ok'],['Assessments',AS.length,'tl'],['Tasks',A.length,'tl'],['Interviews',INT.length,'tl'],['Terminated exams',Object.values(D.att).filter(t=>t.st==='terminated').length,'er']])+`<h2>By senior</h2>${SENIORS.map(n=>{const J=sjs(SMAP[n]);return `<div class="card"><div class="row"><b class="g">${esc(n)}</b>${pill(J.filter(j=>sub(j.roll,w)).length+'/'+J.length+' submitted','tl')}${pill(J.filter(j=>vs(j,w)==='verified').length+' verified','ok')}${pill(J.filter(j=>lastN(j.roll)<tg).length+' below target','er')}</div></div>`}).join('')}`}
function bq(ty){const out=[];for(const q of (F_().qs||[])){const t=ty==='mixed'?q.t:ty,x=q.q.trim();if(!x){toast('Every question needs text');return null}
 if(t==='mcq'){const op=q.o.map((v,i)=>[v.trim(),i]).filter(v=>v[0]),k=op.findIndex(v=>v[1]===q.k);if(op.length<2){toast('Each MCQ needs at least 2 options');return null}if(k<0){toast('Select a correct option that has text');return null}out.push({t,q:x,o:op.map(v=>v[0]),k})}
 else if(t==='blank'){const a=q.a.split(';').map(v=>v.trim()).filter(Boolean);if(!a.length){toast('Each blank needs an accepted answer');return null}out.push({t,q:x,a})}else out.push({t,q:x})}
 if(!out.length){toast('Add at least one question');return null}return out}
function asAdd(){const F=F_(),ty=F.ty||'mcq',pl=(F.pl||'').trim();if(!(F.t||'').trim())return toast('Enter a title');if((ty==='link'&&!pl)||(pl&&!/^https?:\/\//.test(pl)))return toast('Add a valid link starting with https://');let qs=[];
 if(QZ.includes(ty)){qs=bq(ty);if(!qs)return;if(ty==='text')qs=qs.map(q=>q.q)}
 const g=qs.filter(q=>typeof q!=='string'&&q.t!=='text').length,a={id:'k'+Date.now(),ty,title:F.t.trim(),desc:(F.d||'').trim(),due:F.due||dd(),max:+F.max||(g||10),prob:pl||undefined,qs};AS.push(a);D.mk.a.push(a);S.F={};save();toast('✓ Assessment published to all juniors');render()}
function asMarks(id){const F=F_();JUN.forEach(j=>{const v=F['m_'+j.roll];if(v===undefined)return;if(v==='')delete D.am[id+'|'+j.roll];else D.am[id+'|'+j.roll]=+v});S.F={};save();toast('✓ Marks saved');render()}
function aAsm(){const ty=F_().ty||'mcq';return `<h1>Assessments</h1><div class="card"><h2>Assign an assessment (open mode, no proctoring)</h2>${fi('t','Title','e.g. LeetCode: Two Sum')}<label>Submission type</label><select onchange="(S.F=S.F||{}).ty=this.value;S.F.qs=null;render()">${Object.entries(TY).map(([k,l])=>`<option value="${k}" ${ty===k?'selected':''}>${l}</option>`).join('')}</select>${ta('d','Instructions','',2)}${aType(ty)}<div class="row"><div class="g">${fi('due','Due date','','date')}</div><div class="g">${fi('max','Max marks','','number')}</div></div><button class="btn w" onclick="asAdd()">Publish to all juniors</button></div><h2>All assessments (${AS.length})</h2>${AS.map(a=>{const op=S.open===a.id,Sj=JUN.filter(j=>D.asm[a.id+'|'+j.roll]);return `<div class="card"><div class="row"><b class="g">${esc(a.title)}</b>${pill(TY[a.ty],'tl')}${pill(Sj.length+'/'+JUN.length+' submitted','ok')}</div><div class="m">Due ${fd(a.due)}${a.max?' · Max '+a.max:''}</div><div class="row" style="margin-top:8px"><button class="btn o" onclick="S.open=${op?'null':"'"+a.id+"'"};S.F={};render()">${op?'Hide':'Submissions & marks'}</button>${D.mk.a.some(x=>x.id===a.id)?`<button class="btn o" onclick="mkDel('a','${a.id}')">Delete</button>`:''}</div>${op?(Sj.map(j=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${esc(j.name)}</b> <span class="m">${j.roll} · ${esc(j.sr)}</span><br>${asmRes(a,D.asm[a.id+'|'+j.roll])}<input type="number" style="width:130px" placeholder="Marks /${a.max}" value="${D.am[a.id+'|'+j.roll]??''}" oninput="(S.F=S.F||{})['m_${j.roll}']=this.value"></div>`).join('')||'<p class="m">No submissions yet.</p>')+(Sj.length?`<button class="btn w" onclick="asMarks('${a.id}')">Save Marks</button>`:''):''}</div>`}).join('')}`}
function aSen(){const w=cw(),tg=T[w];return `<h1>Seniors</h1>${SENIORS.map(n=>{const J=sjs(SMAP[n]),op=S.open===n;return `<div class="card"><div class="row"><b class="g">${esc(n)}</b>${pill(J.length+' juniors','tl')}${pill(J.filter(j=>sub(j.roll,w)).length+' submitted','ok')}</div><button class="btn o" style="margin-top:6px" onclick="S.open=${op?'null':"'"+n+"'"};render()">${op?'Hide':'View juniors'}</button><button class="btn" style="margin:6px 0 0 6px" onclick="actAs('${n}')">Open as this senior →</button>${op?`<div class="scx"><table class="h"><tr><th>Junior</th><th>Latest</th><th>Target</th><th>This week</th></tr>${J.map(j=>`<tr><td style="text-align:left">${esc(j.name)}<br><span class="m">${j.roll}</span></td><td>${lastN(j.roll)}</td><td>${lastN(j.roll)>=tg?'✓':'✗'}</td><td>${sub(j.roll,w)?vpill(j.roll,w):'–'}</td></tr>`).join('')}</table></div>`:''}</div>`}).join('')}`}

/* --- shared: full junior profile + submissions list --- */
function jFull(j){const L=D.links[j.roll]||{};return `<div style="margin-top:10px;border-top:2px solid var(--teal);padding-top:8px"><h2>${esc(j.name)} · all data</h2>${S.o&&S.o.r==='ad'&&!(FB&&FB.apiKey)?`<div style="margin:6px 0">${D.pw[j.roll]?`<button class="btn o" onclick="pwReset('${j.roll}')">🔑 Reset password</button>`:pill('Password not set yet (first login pending)','wa')}</div>`:''}<b>Weekly LeetCode submissions</b><div class="scx"><table class="h"><tr><th>Week</th><th>Plan</th><th>Submitted</th><th>Real</th><th>Status</th><th>Explain</th></tr>${T.map((t,i)=>{const x=sub(j.roll,i),v=D.ver[j.roll+'|'+i]||{};return x?`<tr><td>W${i+1}</td><td>${t}</td><td>${x.n}</td><td>${v.rc??'–'}</td><td>${({verified:'✓',doubtful:'⚠'})[v.st]||'⏳'}</td><td>${esc(x.p||'')}</td></tr>`:''}).join('')||'<tr><td colspan="6">No submissions yet</td></tr>'}</table></div><b>Profile links</b><div class="m" style="margin:4px 0 10px">${LK.map(([k,l])=>L[k]?`<a href="${esc(L[k])}" target="_blank" rel="noopener">${l}</a>`:l+' (missing)').join(' · ')}</div><b>Assessment submissions (code links, answers, files)</b>${AS.map(a=>{const t=D.asm[a.id+'|'+j.roll];return t?`<div style="padding:6px 0;border-top:1px solid var(--bd)"><b>${esc(a.title)}</b> ${pill(TY[a.ty],'tl')}${D.am[a.id+'|'+j.roll]!=null?pill('Marks '+D.am[a.id+'|'+j.roll]+'/'+a.max,'ok'):''}<br>${asmRes(a,t)}</div>`:''}).join('')||'<p class="m">None yet</p>'}<b>Tasks &amp; interviews</b>${[...A,...INT].filter(a=>a.sr===j.sr).map(a=>`<div style="padding:6px 0;border-top:1px solid var(--bd)"><b>${esc(a.title)}</b> ${a.iv?pill('Interview','tl'):pill('Task','tl')}${D.tm[a.id+'|'+j.roll]!=null?pill('Marks '+D.tm[a.id+'|'+j.roll]+'/'+a.max,'ok'):''}<br>${a.iv&&a.link?ivSt(a,j):attR(a,j)}</div>`).join('')}</div>`}
function sSub(){const J=myJ();return `<h1>Submissions</h1><p class="m">Code links, written answers, files and MCQ results from your juniors.</p>${AS.map(a=>{const Sj=J.filter(j=>D.asm[a.id+'|'+j.roll]),op=S.open===a.id;return `<div class="card"><div class="row"><b class="g">${esc(a.title)}</b>${pill(TY[a.ty],'tl')}${pill(Sj.length+'/'+J.length+' submitted','ok')}</div>${a.prob?`<a href="${esc(a.prob)}" target="_blank" rel="noopener">Problem ↗</a>`:''}<div><button class="btn o" style="margin-top:6px" onclick="S.open=${op?'null':"'"+a.id+"'"};S.F={};render()">${op?'Hide':'View submissions'}</button></div>${op?(Sj.map(j=>`<div style="padding:8px 0;border-top:1px solid var(--bd)"><b>${esc(j.name)}</b> <span class="m">${j.roll}</span><br>${asmRes(a,D.asm[a.id+'|'+j.roll])}<input type="number" style="width:130px" placeholder="Marks /${a.max}" value="${D.am[a.id+'|'+j.roll]??''}" oninput="(S.F=S.F||{})['m_${j.roll}']=this.value"></div>`).join('')||'<p class="m">No submissions yet.</p>')+(Sj.length?`<button class="btn w" onclick="asMarks('${a.id}')">Save Marks</button>`:''):''}</div>`}).join('')}`}

/* ===== Assessment builder: form changes automatically with the chosen type ===== */
const nq=t=>({t,q:'',o:['','','',''],k:0,a:''}),qSet=(i,k,v)=>{F_().qs[i][k]=v},qOpt=(i,k,v)=>{F_().qs[i].o[k]=v},qDel=i=>{F_().qs.splice(i,1);render()},qAddOpt=i=>{F_().qs[i].o.push('');render()},qAdd=()=>{const F=F_();F.qs.push(nq(F.ty==='mixed'||!F.ty?'mcq':F.ty));render()};
const qb=ty=>{const F=F_();F.qs=F.qs||[nq(ty==='mixed'?'mcq':ty)];return F.qs.map((q,i)=>`<div class="card" style="margin:8px 0"><div class="row"><b class="g">Question ${i+1}</b>${ty==='mixed'?`<select style="width:auto;margin:0" onchange="qSet(${i},'t',this.value);render()">${[['mcq','MCQ'],['blank','Fill in the blank'],['text','Written']].map(x=>`<option value="${x[0]}" ${q.t===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select>`:''}<button class="btn o" onclick="qDel(${i})">✕</button></div><label>Question${(ty==='blank'||(ty==='mixed'&&q.t==='blank'))?' (write ____ where the blank is)':''}</label><input value="${esc(q.q)}" oninput="qSet(${i},'q',this.value)">${(ty==='mcq'||(ty==='mixed'&&q.t==='mcq'))?q.o.map((o,k)=>`<div class="row"><input type="radio" name="ck${i}" style="width:auto;margin:0" ${q.k===k?'checked':''} onchange="qSet(${i},'k',${k})"><input class="g" placeholder="Option ${k+1}" value="${esc(o)}" oninput="qOpt(${i},${k},this.value)"></div>`).join('')+`<button class="btn o" onclick="qAddOpt(${i})">+ option</button><div class="m">Tick the radio button next to the correct answer.</div>`:(ty==='blank'||(ty==='mixed'&&q.t==='blank'))?`<label>Accepted answer(s), separate with ;</label><input value="${esc(q.a)}" oninput="qSet(${i},'a',this.value)">`:''}</div>`).join('')+`<button class="btn o" onclick="qAdd()">+ Add question</button>`};
const aType=ty=>QZ.includes(ty)?`${fi('pl','Reference link (optional)','https://...')}<h2 style="margin-top:12px">${{mcq:'MCQ questions',blank:'Fill-in-the-blank questions',text:'Written questions',mixed:'Questions (choose a type for each)'}[ty]}</h2>${qb(ty)}`:ty==='link'?`${fi('pl','Problem link (LeetCode / Codeforces / any)','https://leetcode.com/problems/...')}<p class="m">Juniors open this problem and paste a link to their solution or submission.</p>`:ty==='file'?`${fi('pl','Reference link (optional)','https://...')}<p class="m">Juniors upload a PDF, Word (.doc / .docx) or TXT file, up to 700 KB.</p>`:`${fi('pl','Practice link (contest / problem set)','https://...')}<p class="m">Juniors open the link and tap "Mark as done".</p>`;

render();
</script></body></html>
